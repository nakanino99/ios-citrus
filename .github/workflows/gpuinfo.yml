name: gpuinfo

on:
  workflow_dispatch:
  push:
    branches: [citrus]
    paths:
      - ".github/workflows/gpuinfo.yml"
      - "userland/hakios-metal-lite/**"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: "Build gpuinfo (read-only, GET_PARAM and one buffer)"
        working-directory: userland/hakios-metal-lite
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun --sdk iphoneos clang++ -arch arm64 -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=c++17 -O2 -Wall -Wextra -Wno-invalid-constexpr -Iinclude -o out/gpuinfo \
            gpuinfo.cpp gpu.cpp iokit_transport.cpp \
            -framework IOKit -framework CoreFoundation
          xcrun --sdk iphoneos clang++ -arch arm64 -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=c++17 -O2 -Wall -Wextra -Wno-invalid-constexpr -Iinclude -o out/gpuping \
            gpuping.cpp gpu.cpp iokit_transport.cpp \
            -framework IOKit -framework CoreFoundation
          xcrun --sdk iphoneos clang++ -arch arm64 -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=c++17 -O2 -Wall -Wextra -Wno-invalid-constexpr -I. -Iinclude -o out/gpucompute \
            gpucompute.cpp gpu.cpp pm4.cpp command.cpp compute.cpp texture.cpp render.cpp link.cpp \
            compiler.cpp metallib.cpp iokit_transport.cpp \
            -framework IOKit -framework CoreFoundation -framework IOSurface
          xcrun --sdk iphoneos clang++ -arch arm64 -target arm64-apple-ios16.0 -isysroot "$SDK" \
            -std=c++17 -O2 -Wall -Wextra -Wno-invalid-constexpr -Iinclude -o out/hakios-metal-probe \
            tools/probe.cpp gpu.cpp pm4.cpp command.cpp compute.cpp texture.cpp render.cpp link.cpp \
            compiler.cpp metallib.cpp iokit_transport.cpp \
            -framework IOKit -framework CoreFoundation -framework IOSurface
          codesign -f -s - out/hakios-metal-probe
          codesign -f -s - out/gpuinfo
          codesign -f -s - out/gpuping
          codesign -f -s - out/gpucompute
          otool -L out/gpuping
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: gpuinfo
          path: |
            userland/hakios-metal-lite/out/gpuinfo
            userland/hakios-metal-lite/out/gpuping
            userland/hakios-metal-lite/out/gpucompute
            userland/hakios-metal-lite/out/hakios-metal-probe
          retention-days: 30
