name: runner-test
on:
  push:
    paths: ['.github/workflows/runner-test.yml']
  workflow_dispatch:
jobs:
  m15:
    runs-on: macos-15
    steps:
      - run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version
  mlatest:
    runs-on: macos-latest
    steps:
      - run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version
  m15intel:
    runs-on: macos-15-intel
    steps:
      - run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app
          xcodebuild -version
